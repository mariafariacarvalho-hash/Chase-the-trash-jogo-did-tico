<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guarda Ambiental</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #87ceeb;
      user-select: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    /* MENU */
    #menu {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(rgba(0, 20, 10, .45), rgba(0, 0, 0, .75)),
        linear-gradient(135deg, #64b96b, #193d2a);
      color: white;
      text-align: center;
    }

    #menu h1 {
      font-size: clamp(38px, 7vw, 80px);
      text-shadow: 4px 4px 0 #17351f;
      margin-bottom: 8px;
    }

    #menu p {
      font-size: 18px;
      margin-bottom: 25px;
      opacity: .9;
    }

    .characters {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
    }

    .character {
      width: 190px;
      min-height: 210px;
      border: 3px solid rgba(255,255,255,.35);
      border-radius: 20px;
      background: rgba(255,255,255,.12);
      color: white;
      cursor: pointer;
      padding: 15px;
      transition: .2s;
    }

    .character:hover {
      transform: translateY(-6px);
      background: rgba(255,255,255,.2);
    }

    .character.selected {
      border-color: #ffd84a;
      box-shadow: 0 0 25px #ffd84a;
      background: rgba(255,216,74,.15);
    }

    .avatar {
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
    }

    .character strong {
      display: block;
      font-size: 22px;
    }

    #startButton {
      border: 0;
      border-radius: 15px;
      padding: 16px 45px;
      font-size: 22px;
      font-weight: bold;
      background: #ffd43b;
      color: #19321d;
      cursor: pointer;
      box-shadow: 0 7px 0 #a47c00;
    }

    #startButton:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #a47c00;
    }

    /* HUD */
    #hud {
      position: fixed;
      z-index: 10;
      top: 15px;
      left: 15px;
      right: 15px;
      display: none;
      justify-content: space-between;
      color: white;
      pointer-events: none;
    }

    .hudBox {
      background: rgba(0,0,0,.55);
      padding: 10px 15px;
      border-radius: 12px;
      font-weight: bold;
      backdrop-filter: blur(5px);
    }

    #message {
      position: fixed;
      z-index: 11;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 2px 2px 3px black;
      pointer-events: none;
    }

    /* CONTROLES */
    #controls {
      position: fixed;
      z-index: 12;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 10px;
    }

    .control {
      width: 65px;
      height: 65px;
      border-radius: 15px;
      border: 2px solid white;
      background: rgba(0,0,0,.45);
      color: white;
      font-size: 28px;
    }

    /* GAME OVER */
    #gameOver {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      background: rgba(0,0,0,.7);
    }

    #gameOver h2 {
      font-size: 60px;
      margin-bottom: 15px;
    }

    #gameOver p {
      font-size: 24px;
      margin-bottom: 25px;
    }

    #restart {
      padding: 15px 35px;
      border: 0;
      border-radius: 12px;
      background: #4ade80;
      color: #12351d;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .character {
        width: 145px;
        min-height: 180px;
      }

      .avatar {
        height: 100px;
        font-size: 65px;
      }

      #menu h1 {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

<div id="game"></div>

<!-- MENU -->
<div id="menu">
  <h1>🌳 Guarda Ambiental</h1>
  <p>Escolha quem vai perseguir o poluidor</p>

  <div class="characters">

    <button class="character selected" data-character="pucca">
      <div class="avatar">👧🏻</div>
      <strong>Pucca</strong>
      <small>Guardiã veloz</small>
    </button>

    <button class="character" data-character="kakashi">
      <div class="avatar">🥷</div>
      <strong>Kakashi</strong>
      <small>Ninja ambiental</small>
    </button>

  </div>

  <button id="startButton">▶ COMEÇAR</button>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hudBox">
    🗑️ Lixos: <span id="score">0</span>
  </div>

  <div class="hudBox">
    🏃 Distância: <span id="distance">0</span>m
  </div>

  <div class="hudBox">
    ❤️ Vida: <span id="life">3</span>
  </div>
</div>

<div id="message">
  Pegue o poluidor!
</div>

<!-- CONTROLES MOBILE -->
<div id="controls">
  <button class="control" id="left">◀</button>
  <button class="control" id="jump">▲</button>
  <button class="control" id="right">▶</button>
</div>

<!-- GAME OVER -->
<div id="gameOver">
  <h2>🚨 FIM DE JOGO</h2>
  <p>O poluidor conseguiu escapar!</p>
  <p>Você recolheu <strong id="finalScore">0</strong> lixos.</p>
  <button id="restart">Jogar novamente</button>
</div>
